<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="~ L@u’s Skill Labs (~l@u / ~l4u) — Local-First Rust/Wasm PWA & Ultralight Native Desktop Architecture" />
  <title>~ L@u’s Skill Labs (~l@u / ~l4u)</title>
  <link rel="manifest" href="/manifest.json" />
  <link data-trunk rel="copy-file" href="manifest.json" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <style>
    :root {
      color-scheme: dark;
      --bg-primary: #0f172a;
      --bg-panel: #1e293b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #laus-shell-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      min-height: 48px;
      background: var(--bg-panel);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 0.875rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    #laus-canvas-container {
      position: relative;
      width: 100%;
      height: calc(100% - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#laus_egui_canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <header id="laus-shell-bar">
    <div>
      <strong>~ L@u’s Skill Labs</strong>
      <span id="laus-surface-badge" class="badge">Detecting Surface...</span>
    </div>
    <div>
      <span id="laus-network-badge" class="badge">Offline-First Ready</span>
    </div>
  </header>

  <main id="laus-canvas-container">
    <canvas id="laus_egui_canvas"></canvas>
  </main>

  <script type="module">
    /**
     * Hardware & Viewport Form-Factor Detector for ~ L@u’s Skill Labs.
     * Switches deterministically between `laus-ui-mobile` (touch >= 48px)
     * and `laus-ui-desktop` (dense mouse/keyboard workspace).
     */
    function detectFormFactor() {
      const urlParams = new URLSearchParams(window.location.search);
      const forcedSurface = urlParams.get("surface");
      if (forcedSurface === "mobile" || forcedSurface === "desktop") {
        return forcedSurface;
      }

      const coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      const touchPoints = navigator.maxTouchPoints && navigator.maxTouchPoints > 0;
      const narrowViewport = window.innerWidth < 768;

      return (coarsePointer || (touchPoints && narrowViewport)) ? "mobile" : "desktop";
    }

    async function bootstrapWasmBundle() {
      const surface = detectFormFactor();
      const surfaceBadge = document.getElementById("laus-surface-badge");
      const netBadge = document.getElementById("laus-network-badge");

      const bundleMeta = surface === "mobile"
        ? {
            name: "laus-ui-mobile",
            wasmPath: "/pkg/laus_ui_mobile_bg.wasm",
            jsPath: "/pkg/laus_ui_mobile.js",
            label: "Mobile Touch (>= 48px)"
          }
        : {
            name: "laus-ui-desktop",
            wasmPath: "/pkg/laus_ui_desktop_bg.wasm",
            jsPath: "/pkg/laus_ui_desktop.js",
            label: "Desktop High-Density"
          };

      document.documentElement.dataset.lausSurface = surface;
      document.documentElement.dataset.lausBundle = bundleMeta.name;
      surfaceBadge.textContent = `${bundleMeta.label} [${bundleMeta.name}]`;

      function updateConnectivityStatus() {
        const online = navigator.onLine;
        netBadge.textContent = online ? "Online (Outbox Sync Active)" : "Offline (Local Outbox Queue)";
      }
      window.addEventListener("online", updateConnectivityStatus);
      window.addEventListener("offline", updateConnectivityStatus);
      updateConnectivityStatus();

      if (navigator.storage && navigator.storage.persist) {
        try {
          await navigator.storage.persist();
        } catch (_) {
          // Storage persistence is best-effort
        }
      }

      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        } catch (err) {
          console.warn("[~ L@u PWA] Service Worker registration skipped:", err);
        }
      }

      try {
        const mod = await import(bundleMeta.jsPath);
        if (typeof mod.default === "function") {
          await mod.default(bundleMeta.wasmPath);
        }
      } catch (_) {
        // Wasm bundle is loaded dynamically when built via Trunk/wasm-bindgen
      }
    }

    bootstrapWasmBundle();
  </script>
</body>
</html>
