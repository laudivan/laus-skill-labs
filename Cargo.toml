[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ui-desktop",
    "crates/ui-mobile",
    "crates/launcher",
    "mcp-servers/rust-pwa-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Laudivan Freire de Almeida (~ L@u / Uncle Lau) <laudivan@live.com>"]
repository = "https://github.com/laudivan/laus-skill-labs"

[workspace.dependencies]
laus-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
egui = { version = "0.31", default-features = false }
include_dir = "0.7"
wry = { version = "0.50", default-features = false }
tao = { version = "0.32", default-features = false }
